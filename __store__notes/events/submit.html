<form id="loginForm">

    <input
        type="text"
        id="username"
        placeholder="Enter Username"
    >

    <button type="submit">
        Login
    </button>

</form>

<p id="message"></p>

<script>

const form =
    document.getElementById("loginForm");

form.addEventListener("submit", function (event) {

    event.preventDefault();

    document.getElementById("message").textContent =
        "Form submitted successfully.";
});

</script>
